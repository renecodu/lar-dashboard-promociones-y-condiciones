<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matriz Comercial LAR - Dashboard Interactivo</title>
<link href="https://fonts.cdnfonts.com/css/aileron" rel="stylesheet">
<style>
  /* === PALETA CORPORATIVA LAR GROUP (Manual de Marca 2016) ===
     Primario:   Pantone 7467 C  → #00A8B4 (turquesa corporativo)
     Secundario: Cool Gray 9 C   → #747678 (gris corporativo)
     Tipografía: Aileron (primaria) · Arial (sistema)
     Tema: Light mode — versión positiva del manual */
  :root {
    --lar-brand:      #00A8B4;   /* Pantone 7467 C */
    --lar-brand-dark: #007A84;
    --lar-gray:       #747678;   /* Pantone Cool Gray 9 C */
    --lar-gray-light: #C8CACC;
    --lar-gray-dark:  #4A4C4E;
    /* Superficie */
    --bg:             #F2F2F0;
    --card:           #FFFFFF;
    --card-border:    #E4E4E2;
    /* Texto */
    --text-primary:   #1A1A1A;
    --text-secondary: #747678;
    --text-muted:     #A0A2A4;
    /* Alias para compatibilidad con JS inline */
    --lar-accent:         #00A8B4;
    --lar-accent-light:   #33BDC8;
    --lar-accent-dark:    #007A84;
    --lar-primary:        #007A84;
    --lar-primary-light:  #009AA6;
    --lar-primary-dark:   #005C65;
    --lar-text:           #1A1A1A;
    --lar-text-soft:      #747678;
    --lar-text-muted:     #A0A2A4;
    --lar-card-soft:      #FFFFFF;
    --lar-bg:             #F2F2F0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Aileron', Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 1400px; margin: 0 auto; }

  /* HEADER */
  header {
    display: flex; align-items: center; justify-content: flex-start;
    flex-wrap: wrap; gap: 20px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 20px 28px;
    margin-bottom: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-right { text-align: right; }
  h1 {
    font-size: 1.5rem; font-weight: 700;
    color: var(--text-primary); letter-spacing: 0.3px; margin: 0;
  }
  .subtitle { color: var(--text-secondary); font-size: 0.85rem; margin-top: 2px; }

  /* Logo LAR GROUP — versión negativa (fondo turquesa, texto blanco) */
  .lar-logo {
    display: inline-flex; flex-direction: column; align-items: center;
    background: var(--lar-brand);
    color: #ffffff;
    padding: 8px 14px 6px;
    border-radius: 4px;
    font-family: 'Aileron', Arial, sans-serif;
    font-weight: 800; font-size: 1.1rem;
    letter-spacing: 3px; line-height: 1;
    flex-shrink: 0;
    margin-bottom: 0;
  }
  .lar-logo small {
    display: block; font-size: 0.42rem; font-weight: 600;
    letter-spacing: 4px; margin-top: 3px;
    color: rgba(255,255,255,0.85);
  }

  /* Logotipo oficial LAR GROUP — versión principal positiva (manual de marca 2016) */
  .lar-logo-img { height: 56px; width: auto; display: block; flex-shrink: 0; }
  .header-text { display: flex; flex-direction: column; gap: 2px; }
  .lar-slogan {
    font-family: 'Corbel', 'Aileron', Arial, sans-serif;
    color: var(--lar-brand); font-size: 0.92rem; letter-spacing: 0.2px;
    margin-top: 2px;
  }

  /* Fecha */
  .today-date {
    background: rgba(0,168,180,0.1);
    border: 1px solid rgba(0,168,180,0.3);
    color: var(--lar-brand-dark);
    padding: 6px 14px; border-radius: 20px;
    font-size: 0.8rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .today-date::before { content: '📅'; font-size: 0.85rem; }
  .header-title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .header-title-row h1 { margin-bottom: 0; }

  /* PROJECT GRID */
  .project-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px; margin-bottom: 20px;
  }
  .project-btn {
    padding: 12px 8px;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 8px;
    color: var(--text-secondary);
    font-weight: 600; cursor: pointer;
    transition: all 0.2s ease; font-size: 0.85rem;
    text-align: center; position: relative;
    font-family: 'Aileron', Arial, sans-serif;
  }
  .project-btn:hover {
    border-color: var(--lar-brand);
    color: var(--lar-brand-dark);
    background: rgba(0,168,180,0.05);
  }
  .project-btn.active {
    background: var(--lar-brand);
    border-color: var(--lar-brand);
    color: white;
    box-shadow: 0 3px 10px rgba(0,168,180,0.3);
  }
  .project-btn.collective { border-color: rgba(0,168,180,0.4); }
  .project-btn.collective.active {
    background: var(--lar-brand); color: white;
  }
  .badge-new {
    position: absolute; top: -5px; right: -5px;
    background: var(--lar-brand); color: white; font-size: 0.55rem;
    padding: 2px 5px; border-radius: 8px; font-weight: 700;
  }

  /* CONTROLS */
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: 18px; justify-content: space-between; align-items: center;
  }
  .mode-toggle {
    display: flex; gap: 4px;
    background: var(--card); padding: 4px;
    border-radius: 8px; border: 1px solid var(--card-border);
    flex-wrap: wrap;
  }
  .mode-btn {
    padding: 7px 14px; background: transparent; border: none;
    color: var(--text-secondary); border-radius: 6px; cursor: pointer;
    font-weight: 500; transition: all 0.2s; font-size: 0.85rem;
    font-family: 'Aileron', Arial, sans-serif;
  }
  .mode-btn.active {
    background: var(--lar-brand); color: white; font-weight: 600;
  }
  .search-box {
    flex: 1; min-width: 200px; padding: 9px 14px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 8px; color: var(--text-primary); font-size: 0.9rem;
    font-family: 'Aileron', Arial, sans-serif;
  }
  .search-box::placeholder { color: var(--text-muted); }
  .search-box:focus { outline: none; border-color: var(--lar-brand); box-shadow: 0 0 0 3px rgba(0,168,180,0.1); }

  /* CATEGORY TABS */
  .category-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .cat-tab {
    padding: 6px 14px; background: var(--card);
    border: 1px solid var(--card-border); border-radius: 16px;
    color: var(--text-secondary); cursor: pointer; font-size: 0.82rem;
    font-weight: 500; transition: all 0.2s;
    font-family: 'Aileron', Arial, sans-serif;
  }
  .cat-tab:hover { border-color: var(--lar-brand); color: var(--lar-brand-dark); }
  .cat-tab.active {
    background: var(--lar-brand); color: white;
    border-color: var(--lar-brand); font-weight: 600;
  }

  /* DETAIL VIEW */
  .detail-view {
    background: var(--card); border-radius: 12px;
    border: 1px solid var(--card-border); padding: 24px; margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .project-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px solid var(--card-border);
  }
  .project-icon {
    width: 46px; height: 46px; border-radius: 10px;
    background: var(--lar-brand);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: 700; color: white;
    flex-shrink: 0;
  }
  .project-icon.collective { background: var(--lar-brand); }
  .project-name { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .project-tag {
    display: inline-block; margin-left: 8px; padding: 2px 8px;
    background: rgba(0,168,180,0.1); color: var(--lar-brand-dark);
    border-radius: 6px; font-size: 0.68rem; font-weight: 700; vertical-align: middle;
  }

  /* SECTION TITLES */
  .section-title {
    font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin: 22px 0 10px 0; padding-bottom: 0;
    border-bottom: none;
    display: flex; align-items: center; gap: 6px;
    justify-content: flex-start; flex-wrap: wrap;
  }
  .section-title:first-child { margin-top: 0; }

  /* INFO BANNER */
  .info-banner {
    background: rgba(0,168,180,0.08);
    border-left: 3px solid var(--lar-brand); padding: 10px 14px;
    border-radius: 6px; margin-bottom: 14px; font-size: 0.85rem;
    color: var(--lar-brand-dark);
  }

  /* REQ ITEMS */
  .req-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .req-item {
    display: grid; grid-template-columns: 220px 1fr; gap: 14px;
    padding: 10px 14px;
    background: #FAFAFA;
    border-radius: 8px; border-left: 3px solid var(--lar-brand);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--lar-brand);
  }
  .req-label { font-weight: 600; color: var(--text-secondary); font-size: 0.85rem; }
  .req-value { color: var(--text-primary); font-size: 0.85rem; line-height: 1.5; }

  /* PROFILE TABS */
  .profile-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .profile-tab {
    padding: 8px 14px; background: var(--card);
    border: 1px solid var(--card-border); border-radius: 8px;
    color: var(--text-secondary); cursor: pointer; font-size: 0.82rem;
    font-weight: 500; transition: all 0.2s;
    font-family: 'Aileron', Arial, sans-serif;
  }
  .profile-tab:hover { border-color: var(--lar-brand); color: var(--lar-brand-dark); }
  .profile-tab.active {
    background: var(--lar-brand); color: white;
    border-color: var(--lar-brand); font-weight: 600;
  }

  /* PROMO CARDS */
  .promo-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px;
  }
  .promo-card {
    padding: 12px 14px; border-radius: 10px; border: 1.5px solid;
    transition: all 0.2s;
  }
  .promo-yes {
    background: rgba(0,168,180,0.06);
    border-color: var(--lar-brand);
  }
  .promo-no {
    background: #FAFAFA;
    border-color: var(--card-border); opacity: 0.6;
  }
  .promo-eval {
    background: rgba(234,179,8,0.07);
    border-color: rgba(234,179,8,0.5);
  }
  .promo-status {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: 0.7rem; font-weight: 700; margin-bottom: 6px;
  }
  .status-yes { background: var(--lar-brand); color: white; }
  .status-no { background: #E4E4E2; color: var(--text-muted); }
  .status-eval { background: #eab308; color: #fff; }
  .promo-text { font-size: 0.84rem; color: var(--text-primary); line-height: 1.4; }

  /* TABLES */
  .comparison-wrap {
    overflow-x: auto; background: var(--card);
    border-radius: 12px; border: 1px solid var(--card-border); padding: 0;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--card-border); }
  th {
    background: #F7F7F5; color: var(--text-secondary);
    font-weight: 700; position: sticky; top: 0; text-align: center;
    border-bottom: 2px solid var(--lar-brand); font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  th.collective-col { background: rgba(0,168,180,0.1); color: var(--lar-brand-dark); }
  th:first-child { text-align: left; min-width: 180px; }
  td:first-child {
    font-weight: 600; color: var(--text-primary);
    background: #FAFAFA; min-width: 180px;
  }
  td { color: var(--text-secondary); vertical-align: top; text-align: center; }
  tr:hover td { background: rgba(0,168,180,0.04); }
  .cell-yes { color: var(--lar-brand); font-weight: 700; }
  .cell-no { color: var(--text-muted); }
  .cell-eval { color: #d97706; font-weight: 600; font-size: 0.78rem; }

  /* BADGES */
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 0.72rem; font-weight: 600;
  }
  .badge-yes { background: rgba(0,168,180,0.12); color: var(--lar-brand-dark); }
  .badge-no { background: #EFEFED; color: var(--text-muted); }
  .badge-eval { background: rgba(234,179,8,0.15); color: #b45309; }

  .hidden { display: none !important; }

  /* LEGEND */
  .legend {
    display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px;
    padding: 10px 14px; background: var(--card);
    border-radius: 8px; font-size: 0.83rem;
    border: 1px solid var(--card-border);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  @media (max-width: 768px) {
    h1 { font-size: 1.2rem; }
    .req-item { grid-template-columns: 1fr; gap: 2px; }
    .project-grid { grid-template-columns: repeat(3, 1fr); }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

function renderCollectiveDetail() {
  const view = document.getElementById('detailView');
  let html = `
    <div class="project-header">
      <div class="project-icon collective">C</div>
      <div>
        <div class="project-name">COLLECTIVE Bustamante <span class="project-tag">CONDICIONES BST</span></div>
        <div style="color:#94a3b8;font-size:0.9rem">Versión 1 · Última actualización: 05 marzo 2026</div>
      </div>
    </div>
  `;
  
  const searchTerm = document.getElementById('search').value.toLowerCase();
  
  // PROMOCIONES PRIMERO en COLLECTIVE
  const collPromos = promotions.filter(p => {
    const status = p.values.COLLECTIVE;
    if (status !== 'SI' && status !== 'EVAL') return false;
    return !searchTerm || p.name.toLowerCase().includes(searchTerm);
  });
  if (collPromos.length > 0) {
    const availableCount = collPromos.filter(p => p.values.COLLECTIVE === 'SI').length;
    const evalCount = collPromos.filter(p => p.values.COLLECTIVE === 'EVAL').length;
    
    html += `
      <h3 class="section-title">
        🎁 Promociones Disponibles
        <span style="margin-left:auto;font-size:0.8rem;font-weight:500;color:#94a3b8">
          <span style="color:var(--lar-accent-light)">${availableCount} activas</span>
          ${evalCount > 0 ? ` · <span style="color:#fbbf24">${evalCount} en evaluación</span>` : ''}
        </span>
      </h3>
      <div class="promo-grid">
    `;
    collPromos.forEach(promo => {
      const status = promo.values.COLLECTIVE;
      const cls = status === 'SI' ? 'promo-yes' : status === 'EVAL' ? 'promo-eval' : 'promo-no';
      const statusCls = status === 'SI' ? 'status-yes' : status === 'EVAL' ? 'status-eval' : 'status-no';
      const statusText = status === 'SI' ? '✓ DISPONIBLE' : status === 'EVAL' ? '⏳ EN EVALUACIÓN' : '✗ NO DISPONIBLE';
      html += `
        <div class="promo-card ${cls}">
          <span class="promo-status ${statusCls}">${statusText}</span>
          <div class="promo-text">${promo.icon} ${promo.name}</div>
        </div>
      `;
    });
    html += '</div>';
  }
  
  // Luego, info banner + selector de perfiles + requisitos
  html += `
    <div class="info-banner" style="margin-top:25px">
      ℹ️ <strong>Collective Bustamante</strong> opera con condiciones comerciales propias diferenciadas del resto de proyectos LAR. Selecciona el perfil del arrendatario:
    </div>
    <div class="profile-tabs">
      <button class="profile-tab ${currentProfile==='dependiente'?'active':''}" data-profile="dependiente">👔 Dependiente</button>
      <button class="profile-tab ${currentProfile==='independiente'?'active':''}" data-profile="independiente">🧑‍💻 Independiente</button>
      <button class="profile-tab ${currentProfile==='juridica'?'active':''}" data-profile="juridica">🏢 Jurídica</button>
      <button class="profile-tab ${currentProfile==='especial'?'active':''}" data-profile="especial">👵 Casos Especiales</button>
    </div>
  `;
  
  const profile = collectiveProfiles[currentProfile];
  const items = profile.items.filter(i => 
    !searchTerm || i.label.toLowerCase().includes(searchTerm) || i.value.toLowerCase().includes(searchTerm)
  );
  
  html += `<h3 class="section-title">${profile.title}</h3><div class="req-grid">`;
  items.forEach(item => {
    let displayVal = item.value;
    if (item.value === 'SI') displayVal = '<span class="badge badge-yes">✓ SI</span>';
    else if (item.value === 'NO') displayVal = '<span class="badge badge-no">✗ NO</span>';
    else if (item.value === 'N/A') displayVal = '<span class="badge badge-no">N/A</span>';
    html += `
      <div class="req-item" style="border-left-color:var(--lar-accent-light)">
        <div class="req-label" style="color:var(--lar-accent-light)">${item.label}</div>
        <div class="req-value">${displayVal}</div>
      </div>
    `;
  });
  html += '</div>';
  
  view.innerHTML = html;
  
  document.querySelectorAll('.profile-tab').forEach(tab => {
    tab.onclick = () => {
      currentProfile = tab.dataset.profile;
      renderCollectiveDetail();
    };
  });
}

    <div class="project-header">
      <div class="project-icon">${initial}</div>
      <div>
        <div class="project-name">${displayName}</div>
        <div style="color:#94a3b8;font-size:0.9rem">${subtitle}</div>
      </div>
    </div>
  `;
  
  const cats = currentCategory === 'all' ? Object.keys(requirements) : [currentCategory];
  const searchTerm = document.getElementById('search').value.toLowerCase();
  
  // PROMOCIONES PRIMERO (siempre visibles excepto cuando hay un filtro de categoría que las excluye)
  if (currentCategory === 'all' || currentCategory === 'extras') {
    // Solo promociones vigentes (SI / EVAL): se limpian las calugas "no disponible"
    const projectPromos = promotions.filter(p => {
      const status = p.values[currentProject];
      if (status !== 'SI' && status !== 'EVAL') return false;
      if (!searchTerm) return true;
      return p.name.toLowerCase().includes(searchTerm);
    });
    const availableCount = projectPromos.filter(p => p.values[currentProject] === 'SI').length;
    const evalCount = projectPromos.filter(p => p.values[currentProject] === 'EVAL').length;

    html += `
      <h3 class="section-title">
        🎁 Promociones Vigentes
        <span style="margin-left:auto;font-size:0.8rem;font-weight:600;color:var(--text-muted)">
          <span style="color:var(--lar-brand-dark)">${availableCount} vigente${availableCount===1?'':'s'}</span>
          ${evalCount > 0 ? ` · <span style="color:#b45309">${evalCount} en evaluación</span>` : ''}
        </span>
      </h3>
    `;

    if (projectPromos.length === 0) {
      html += `
        <div style="background:#FAFAFA;border:1px dashed var(--card-border);color:var(--text-muted);
                    padding:14px 16px;border-radius:8px;margin-bottom:14px;font-size:0.88rem">
          Sin promociones vigentes para este proyecto.
        </div>
      `;
    } else {
      // Regla comercial: al mes gratis se suma como máximo 1 promoción adicional
      html += `
        <div class="info-banner" style="border-left-color:#eab308;background:rgba(234,179,8,0.08);color:#92400e">
          ⚠️ Las promociones <strong>no son acumulables</strong>: al mes gratis se puede sumar como máximo <strong>1 promoción adicional</strong>.
        </div>
      `;
      // Nota específica del proyecto (restricciones por tipología, modelo, torre, etc.)
      if (projectNotes[currentProject]) {
        html += `<div class="info-banner">${projectNotes[currentProject]}</div>`;
      }

      html += '<div class="promo-grid">';
      projectPromos.forEach(promo => {
        const status = promo.values[currentProject];
        const cls = status === 'SI' ? 'promo-yes' : 'promo-eval';
        const statusCls = status === 'SI' ? 'status-yes' : 'status-eval';
        const statusText = status === 'SI' ? '✓ DISPONIBLE' : '⏳ EN EVALUACIÓN';
        html += `
          <div class="promo-card ${cls}">
            <span class="promo-status ${statusCls}">${statusText}</span>
            <div class="promo-text">${promo.icon} ${promo.name}</div>
          </div>
        `;
      });
      html += '</div>';
    }
  }
  
  // Luego los requisitos por categoría
  cats.forEach(cat => {
    const cfg = categoryConfig[cat];
    const items = requirements[cat].filter(r => {
      if (!searchTerm) return true;
      const val = getValue(r, currentProject).toLowerCase();
      return r.label.toLowerCase().includes(searchTerm) || val.includes(searchTerm);
    });
    if (items.length === 0) return;
    
    html += `<h3 class="section-title">${cfg.icon} ${cfg.title}</h3><div class="req-grid">`;
    items.forEach(req => {
      const val = getValue(req, currentProject);
      if (val === '—') return;
      const isYes = val === 'SI';
      const isNo = val === 'No' || val === 'NO';
      const isEval = val.includes('EVALUACIÓN');
      let displayVal = val;
      if (isYes) displayVal = '<span class="badge badge-yes">✓ SI</span>';
      else if (isNo) displayVal = '<span class="badge badge-no">✗ NO</span>';
      else if (isEval) displayVal = '<span class="badge badge-eval">⏳ EN EVALUACIÓN</span>';
      
      html += `
        <div class="req-item">
          <div class="req-label">${req.label}</div>
          <div class="req-value">${displayVal}${req.note ? `<div style="color:#94a3b8;font-size:0.8rem;margin-top:4px;font-style:italic">ℹ️ ${req.note}</div>` : ''}</div>
        </div>
      `;
    });
    html += '</div>';
  });
  
  view.innerHTML = html;
}

function renderCompare() {
  const table = document.getElementById('compareTable');
  const searchTerm = document.getElementById('search').value.toLowerCase();
  
  let html = '<thead><tr><th>Requisito</th>';
  projects.forEach(p => {
    const cls = p === 'COLLECTIVE' ? 'collective-col' : '';
    const name = projectDisplayNames[p] || p;
    html += `<th class="${cls}">${name}</th>`;
  });
  html += '</tr></thead><tbody>';
  
  Object.keys(requirements).forEach(cat => {
    const cfg = categoryConfig[cat];
    const filtered = requirements[cat].filter(r => {
      if (!searchTerm) return true;
      return r.label.toLowerCase().includes(searchTerm);
    });
    if (filtered.length === 0) return;
    
    html += `<tr><td colspan="${projects.length+1}" style="background:rgba(0,168,180,0.18);color:var(--lar-accent-light);text-align:center;font-weight:700;padding:12px">${cfg.icon} ${cfg.title.toUpperCase()}</td></tr>`;
    
    filtered.forEach(req => {
      html += `<tr><td>${req.label}</td>`;
      projects.forEach(p => {
        const val = getValue(req, p);
        let cellClass = '';
        let display = val;
        if (val === 'SI') { cellClass = 'cell-yes'; display = '✓'; }
        else if (val === 'No' || val === 'NO') { cellClass = 'cell-no'; display = '✗'; }
        else if (val.includes('EVALUACIÓN')) { cellClass = 'cell-eval'; display = '⏳'; }
        else if (val === '—') { display = '<span style="color:#475569">—</span>'; }
        else if (val === 'N/A') { cellClass = 'cell-no'; display = 'N/A'; }
        else display = `<span style="font-size:0.75rem;color:#cbd5e1">${val.length > 60 ? val.substring(0,60)+'...' : val}</span>`;
        html += `<td class="${cellClass}" title="${val.replace(/"/g,'&quot;')}">${display}</td>`;
      });
      html += '</tr>';
    });
  });
  
  html += '</tbody>';
  table.innerHTML = html;
}

function renderPromos() {
  const table = document.getElementById('promosTable');
  const searchTerm = document.getElementById('search').value.toLowerCase();
  
  let html = '<thead><tr><th>Promoción</th>';
  projects.forEach(p => {
    const cls = p === 'COLLECTIVE' ? 'collective-col' : '';
    const name = projectDisplayNames[p] || p;
    html += `<th class="${cls}">${name}</th>`;
  });
  html += '</tr></thead><tbody>';
  
  promotions.filter(p => !searchTerm || p.name.toLowerCase().includes(searchTerm)).forEach(promo => {
    html += `<tr><td>${promo.icon} ${promo.name}</td>`;
    projects.forEach(p => {
      const v = promo.values[p];
      const cls = v === 'SI' ? 'cell-yes' : v === 'EVAL' ? 'cell-eval' : 'cell-no';
      const sym = v === 'SI' ? '✓' : v === 'EVAL' ? '⏳' : '✗';
      const tip = v === 'EVAL' ? 'En Evaluación' : v === 'SI' ? 'Disponible' : 'No Disponible';
      html += `<td class="${cls}" title="${tip}">${sym}</td>`;
    });
    html += '</tr>';
  });
  
  html += `<tr style="background:rgba(0,168,180,0.18)"><td style="font-weight:700;color:var(--lar-brand-dark)">📊 Total promos vigentes</td>`;
  projects.forEach(p => {
    const count = promotions.filter(promo => promo.values[p] === 'SI').length;
    html += `<td style="font-weight:700;color:var(--lar-brand-dark);font-size:1.1rem">${count}/${promotions.length}</td>`;
  });
  html += '</tr>';
  
  html += '</tbody>';
  table.innerHTML = html;
}

document.getElementById('search').addEventListener('input', () => {
  if (currentMode === 'detail') renderDetail();
  else if (currentMode === 'compare') renderCompare();
  else if (currentMode === 'promos') renderPromos();
});

renderDetail();
</script>
</body>
</html>
